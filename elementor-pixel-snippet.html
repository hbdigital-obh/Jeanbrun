<!-- ===================================================================
  BLOC 3 — UTM → Champs cachés (tracking source pub)
  Où coller : Elementor → Site Settings → Custom Code → <body> (end)
  Ce script lit les UTM dans l'URL et les injecte dans les champs
  cachés du formulaire (utm_source, utm_medium, utm_campaign, etc.)

  PRÉREQUIS : Ajouter dans le formulaire Elementor des champs Texte
  cachés (Hidden Field) avec les IDs :
    utm_source / utm_medium / utm_campaign / utm_content / utm_term / c3
=================================================================== -->

<!-- UTM TRACKING — coller dans le <body> end -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var urlParams = new URLSearchParams(window.location.search);
    var utmFields = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'c3'];

    utmFields.forEach(function (param) {
      var value = urlParams.get(param);
      if (value) {
        // Elementor génère des inputs avec name="form_fields[ID]"
        var input = document.querySelector('input[name="form_fields[' + param + ']"]');
        if (input) {
          input.value = value;
        }
      }
    });
  });
</script>
<!-- FIN UTM TRACKING -->
